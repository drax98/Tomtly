name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: home_control
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - name: Postgres tests
        run: TEST_DATABASE_URL='postgres://test:test@localhost:5432/home_control?sslmode=disable' go test -count=1 ./internal/store/

  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.app }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Bundled extensions
        if: matrix.app == 'web'
        run: pnpm test:extensions
      - run: pnpm build

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Known vulnerabilities in the Go modules this code actually calls.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      # Common Go security mistakes. G104 (unchecked errors) is left to review: the code marks the deliberate ones.
      # G304 (a file read from a variable path) is left out: every such path is the config folder or one this process
      # made. Deliberate exceptions carry a #nosec with their reason. Test fixtures, examples and dev tools aren't shipped.
      - uses: securego/gosec@v2.30.0
        with:
          args: -exclude=G104,G304 -exclude-dir=extensions -exclude-dir=examples -exclude-dir=tools -exclude-dir=fixtures ./...
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Known vulnerabilities in the web apps' dependencies
        run: |
          (cd web && pnpm audit --prod)

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@v3

  images:
    name: Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [go, web]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: web/e2e/.results/
          retention-days: 14
